<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nội Thất Gỗ Xưởng Nhà - Nam Định</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Xưởng Nội Thất Nam Định</h1>
        <p>Bao lắp đặt tận phòng - Giá gốc tại xưởng</p>
        <a href="tel:0912345678" class="btn-call">Gọi Bố Tôi: 0912.xxx.xxx</a>
    </header>

    <main class="container">
        <div class="card">
            <img src="https://via.placeholder.com/300x200" alt="Giường ngủ">
            <h3>Giường Ngủ Hiện Đại</h3>
            <p class="desc">Chất liệu ván công nghiệp dày dặn, không cong vênh.</p>
            <p class="price">Giá: 1.800.000đ (Bao lắp đặt)</p>
        </div>

        <div class="card">
            <img src="https://via.placeholder.com/300x200" alt="Tủ quần áo">
            <h3>Tủ Áo 3 Cánh</h3>
            <p class="desc">Kích thước 1m6 x 2m, bản lề hơi êm ái.</p>
            <p class="price">Giá: 2.500.000đ (Bao lắp đặt)</p>
        </div>
    </main>
</body>
</html>
